name: Prepare native location dependency lock
on:
  push:
    branches: [fix/android-native-geolocation-20261024]
    paths: [.github/workflows/prepare-native-location-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Generate exact Expo 57 compatible lock
        working-directory: apps/mobile
        run: |
          npm install expo-location@57.0.21 --save --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit
      - name: Commit dependency and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json apps/mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(android): lock Expo SDK 57 native location dependency"
            git push
          fi

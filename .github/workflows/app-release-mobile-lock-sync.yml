name: One-time Android app-management lockfile update
on:
  push:
    branches: [feat/admin-app-management-version-gate-20261104]
    paths:
      - .github/workflows/app-release-mobile-lock-sync.yml
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-app-management-version-gate-20261104
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve native version dependency
        working-directory: apps/mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit exact version lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(mobile): lock expo-application version"
          git push origin HEAD:refs/heads/feat/admin-app-management-version-gate-20261104

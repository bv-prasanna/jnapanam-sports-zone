spring:
  application:
    name: jnapanam-sports-zone-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jnapanam_sports_zone}
    username: ${DB_USERNAME:jnapanam}
    password: ${DB_PASSWORD:jnapanam_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.show-details: when_authorized
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  payment:
    provider: ${PAYMENT_PROVIDER:mock}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    currency: INR
  booking:
    hold-minutes: ${BOOKING_HOLD_MINUTES:10}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  security:
    jwt-secret: ${JWT_SECRET:Sm5hcGFuYW0gU3BvcnRzIFpvbmUgRGV2ZWxvcG1lbnQgSldUIFNlY3JldCAyMDI2IQ==}
    access-token-minutes: ${JWT_ACCESS_MINUTES:43200}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
